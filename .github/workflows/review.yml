name: Review Attestations

on:
  workflow_run:
    workflows: ["CI Build & Audit"]
    types: [completed]

jobs:
  gate-check:
    name: Gate Check
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Extract PR metadata
        id: pr
        run: |
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          HEAD_SHA="${{ github.event.workflow_run.pull_requests[0].head.sha }}"
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "No pull request associated with this workflow run"
            exit 1
          fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "PR #$PR_NUMBER at commit $HEAD_SHA"

  matrix-setup:
    name: Resolve Review Matrix
    needs: gate-check
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Download build matrix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-matrix
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load matrix
        id: matrix
        run: |
          # The build-matrix artifact is produced by a run whose workflow definition
          # comes from the PR head, so on a fork PR its contents are attacker
          # controlled. These values fan out into matrix expansions that reach
          # `run:` blocks in privileged jobs, so validate them at the trust
          # boundary: strict key set, strict character allowlist, bounded size.
          if ! jq -e '
            type == "array" and length > 0 and length <= 64 and
            all(.[];
              type == "object" and
              (keys_unsorted | sort) == ["arch","distro_key","image","variant","version"] and
              all(.[]; type == "string" and (length | . > 0 and . <= 64) and test("^[A-Za-z0-9._-]+$")) and
              .image == (.distro_key + "-" + .variant)
            )' build-matrix.json > /dev/null; then
            echo "::error::build-matrix.json failed schema validation - refusing to build a matrix from it"
            jq -c . build-matrix.json || cat build-matrix.json
            exit 1
          fi

          MATRIX=$(jq -c . build-matrix.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Review matrix: $MATRIX"

  review:
    name: Review Image Variant
    needs: [gate-check, matrix-setup]
    runs-on: ubuntu-latest
    environment: Review-Actor
    permissions:
      contents: read
      packages: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate-check.outputs.head_sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@e1523de7571e31dbe865fd2e80c5c7c23ae71eb4 # v3.4.0

      - name: Install OPA
        run: |
          curl -sSfL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Evidence Bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evidence-${{ matrix.image }}-${{ matrix.arch }}
          path: evidence/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Image URI
        id: image
        run: |
          IMAGE_URI=$(jq -r '.buildDefinition.internalParameters.output.uri' evidence/provenance.json)
          if [[ -z "$IMAGE_URI" || "$IMAGE_URI" == "null" ]]; then
            echo "Failed to resolve image URI from provenance"
            exit 1
          fi
          echo "uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Image URI: $IMAGE_URI"

      - name: Verify Build Attestation Signatures
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          echo "Verifying SBOM attestation signature..."
          cosign verify-attestation \
            --key .github/pdp/public-keys/build.pub \
            --type spdxjson \
            --insecure-ignore-tlog \
            --certificate-identity-regexp='.*' \
            --certificate-oidc-issuer-regexp='.*' \
            "$IMAGE_URI" > /dev/null

          echo "Verifying CVE report attestation signature..."
          cosign verify-attestation \
            --key .github/pdp/public-keys/build.pub \
            --type vuln \
            --insecure-ignore-tlog \
            --certificate-identity-regexp='.*' \
            --certificate-oidc-issuer-regexp='.*' \
            "$IMAGE_URI" > /dev/null

          echo "Verifying SLSA provenance attestation signature..."
          cosign verify-attestation \
            --key .github/pdp/public-keys/build.pub \
            --type slsaprovenance1 \
            --insecure-ignore-tlog \
            --certificate-identity-regexp='.*' \
            --certificate-oidc-issuer-regexp='.*' \
            "$IMAGE_URI" > /dev/null

          echo "All build attestation signatures verified"

      - name: Verify Evidence Blob Signatures
        run: |
          echo "Verifying evidence blob signatures against build key..."
          for artifact in sbom.json cve-report.json provenance.json checksums.sha256; do
            echo "  Verifying $artifact..."
            cosign verify-blob \
              --key .github/pdp/public-keys/build.pub \
              --insecure-ignore-tlog \
              --signature "evidence/${artifact}.sig" \
              "evidence/${artifact}"
          done

          echo "Verifying evidence checksums..."
          cd evidence && sha256sum --check checksums.sha256
          cd ..

          echo "All evidence blob signatures and checksums verified"

      - name: Upstream Digest Cross-Check
        id: upstream
        env:
          DISTRO_KEY: ${{ matrix.distro_key }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          PROV_DIGEST=$(jq -r '.buildDefinition.resolvedDependencies[0].digest.sha256' evidence/provenance.json)
          # Passed via --arg, never interpolated into the filter string.
          EXPECTED_DIGEST=$(jq -r --arg dk "$DISTRO_KEY" --arg var "$VARIANT" --arg arch "$ARCH" \
            '.[$dk][$var][$arch].digest' versions.json | sed 's/^sha256://')

          echo "Provenance upstream digest: $PROV_DIGEST"
          echo "versions.json digest:       $EXPECTED_DIGEST"

          if [[ "$PROV_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "FAIL: Upstream digest mismatch"
            exit 1
          fi

          echo "Upstream digest cross-check passed"

      - name: OPA CVE Policy Evaluation
        id: cve-policy
        run: |
          CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' evidence/cve-report.json)
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' evidence/cve-report.json)
          MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' evidence/cve-report.json)
          LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' evidence/cve-report.json)

          # Fixable = upstream has published a fixed version. Grype reports
          # fix.state as one of: fixed | not-fixed | wont-fix | unknown.
          # Only "fixed" is actionable — a rebuild can clear it.
          FIX_CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical" and .vulnerability.fix.state == "fixed")] | length' evidence/cve-report.json)
          FIX_HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High" and .vulnerability.fix.state == "fixed")] | length' evidence/cve-report.json)

          echo "CVE summary: Critical=$CRITICAL High=$HIGH Medium=$MEDIUM Low=$LOW"
          echo "Fixable:     Critical=$FIX_CRITICAL High=$FIX_HIGH"

          jq -n \
            --argjson critical "$CRITICAL" \
            --argjson high "$HIGH" \
            --argjson medium "$MEDIUM" \
            --argjson low "$LOW" \
            --argjson fixCritical "$FIX_CRITICAL" \
            --argjson fixHigh "$FIX_HIGH" \
            '{
              "scan_results": {
                "critical_count": $critical,
                "high_count": $high,
                "medium_count": $medium,
                "low_count": $low,
                "fixable_critical_count": $fixCritical,
                "fixable_high_count": $fixHigh
              }
            }' > /tmp/opa-input.json

          OPA_RESULT=$(opa eval \
            --data .github/pdp/policies.rego \
            --input /tmp/opa-input.json \
            'data.tbi.pdp.violation_security_threshold' \
            --format raw)

          echo "OPA result: $OPA_RESULT"

          if [[ "$OPA_RESULT" == "[]" || "$OPA_RESULT" == "{}" ]]; then
            echo "result=PASS" >> $GITHUB_OUTPUT
          else
            echo "result=FAIL" >> $GITHUB_OUTPUT
          fi

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT
          echo "fixable_critical=$FIX_CRITICAL" >> $GITHUB_OUTPUT
          echo "fixable_high=$FIX_HIGH" >> $GITHUB_OUTPUT

      - name: Generate Review Verdict
        id: verdict
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          CVE_RESULT: ${{ steps.cve-policy.outputs.result }}
          CVE_CRITICAL: ${{ steps.cve-policy.outputs.critical }}
          CVE_HIGH: ${{ steps.cve-policy.outputs.high }}
          CVE_MEDIUM: ${{ steps.cve-policy.outputs.medium }}
          CVE_LOW: ${{ steps.cve-policy.outputs.low }}
          CVE_FIXABLE_CRITICAL: ${{ steps.cve-policy.outputs.fixable_critical }}
          CVE_FIXABLE_HIGH: ${{ steps.cve-policy.outputs.fixable_high }}
          MATRIX_VARIANT: ${{ matrix.variant }}
          MATRIX_DISTRO_KEY: ${{ matrix.distro_key }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          IMAGE_DIGEST=$(echo "$IMAGE_URI" | cut -d'@' -f2)

          # Compute evidence checksums
          SBOM_SHA=$(sha256sum evidence/sbom.json | cut -d' ' -f1)
          CVE_SHA=$(sha256sum evidence/cve-report.json | cut -d' ' -f1)
          PROV_SHA=$(sha256sum evidence/provenance.json | cut -d' ' -f1)

          # Determine overall verdict — PASS only if all checks pass
          if [[ "$CVE_RESULT" == "PASS" ]]; then
            VERDICT="PASS"
          else
            VERDICT="FAIL"
          fi

          jq -n \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg reviewer "review-actor" \
            --arg reviewRunId "${{ github.run_id }}" \
            --arg buildRunId "${{ github.event.workflow_run.id }}" \
            --arg pullRequest "${{ needs.gate-check.outputs.pr_number }}" \
            --arg commitSha "${{ needs.gate-check.outputs.head_sha }}" \
            --arg uri "$IMAGE_URI" \
            --arg digest "$IMAGE_DIGEST" \
            --arg variant "$MATRIX_VARIANT" \
            --arg version "$MATRIX_DISTRO_KEY" \
            --arg arch "$MATRIX_ARCH" \
            --arg cveResult "$CVE_RESULT" \
            --argjson critical "${CVE_CRITICAL}" \
            --argjson high "${CVE_HIGH}" \
            --argjson medium "${CVE_MEDIUM}" \
            --argjson low "${CVE_LOW}" \
            --argjson fixableCritical "${CVE_FIXABLE_CRITICAL}" \
            --argjson fixableHigh "${CVE_FIXABLE_HIGH}" \
            --arg verdict "$VERDICT" \
            --arg sbomSha "$SBOM_SHA" \
            --arg cveSha "$CVE_SHA" \
            --arg provSha "$PROV_SHA" \
            '{
              "metadata": {
                "timestamp": $timestamp,
                "reviewer": $reviewer,
                "reviewRunId": $reviewRunId,
                "buildRunId": $buildRunId,
                "pullRequest": $pullRequest,
                "commitSha": $commitSha
              },
              "subject": {
                "uri": $uri,
                "digest": $digest,
                "variant": $variant,
                "version": $version,
                "arch": $arch
              },
              "checks": {
                "attestation_signatures": {
                  "result": "PASS",
                  "detail": "SBOM, CVE, and provenance attestation signatures verified against build.pub"
                },
                "evidence_blob_signatures": {
                  "result": "PASS",
                  "detail": "All evidence blobs and checksums verified against build.pub"
                },
                "upstream_digest_match": {
                  "result": "PASS",
                  "detail": "Provenance upstream digest matches versions.json"
                },
                "cve_policy": {
                  "result": $cveResult,
                  "policy": "tbi.pdp.violation_security_threshold",
                  "summary": {
                    "critical": $critical,
                    "high": $high,
                    "medium": $medium,
                    "low": $low,
                    "fixable_critical": $fixableCritical,
                    "fixable_high": $fixableHigh
                  }
                }
              },
              "verdict": $verdict,
              "evidence_checksums": {
                "sbom_sha256": $sbomSha,
                "cve_report_sha256": $cveSha,
                "provenance_sha256": $provSha
              }
            }' > review-verdict.json

          echo "Review verdict: $VERDICT"
          cat review-verdict.json

      - name: Sign and Attach Review Attestation
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          echo "Signing review verdict..."
          cosign sign-blob --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
            --output-signature review-verdict.json.sig review-verdict.json

          echo "Attaching review attestation to image..."
          cosign attest --yes --replace --tlog-upload=false \
            --key env://COSIGN_PRIVATE_KEY \
            --type https://infrashift.io/attestation/review/v1 \
            --predicate review-verdict.json "$IMAGE_URI"

          echo "Review attestation attached"

      - name: Upload Review Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            review-verdict.json
            review-verdict.json.sig

  summary:
    name: Post Review Summary
    needs: [gate-check, review]
    if: always() && needs.gate-check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
      statuses: write

    steps:
      - name: Download All Review Verdicts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: review-*
          path: verdicts/

      - name: Generate Summary Comment
        id: summary
        env:
          PR_NUMBER: ${{ needs.gate-check.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate-check.outputs.head_sha }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/pr-comment.md << 'HEADER'
          ## Review Attestation Summary

          HEADER

          SHORT_SHA="${HEAD_SHA:0:7}"
          BUILD_URL="https://github.com/${REPO}/actions/runs/${BUILD_RUN_ID}"
          REVIEW_URL="https://github.com/${REPO}/actions/runs/${REVIEW_RUN_ID}"

          echo "**PR:** #${PR_NUMBER} | **Commit:** \`${SHORT_SHA}\` | **Build:** [${BUILD_RUN_ID}](${BUILD_URL}) | **Review:** [${REVIEW_RUN_ID}](${REVIEW_URL})" >> /tmp/pr-comment.md
          echo "" >> /tmp/pr-comment.md

          # Policy checks table
          echo "| Image | Arch | Attestations | Evidence | Upstream | CVE Policy | Verdict |" >> /tmp/pr-comment.md
          echo "|-------|------|:------------:|:--------:|:--------:|:----------:|:-------:|" >> /tmp/pr-comment.md

          OVERALL_VERDICT="PASS"

          for dir in verdicts/review-*/; do
            [ -f "${dir}review-verdict.json" ] || continue
            VERDICT_FILE="${dir}review-verdict.json"

            VARIANT=$(jq -r '.subject.version + "-" + .subject.variant' "$VERDICT_FILE")
            ARCH=$(jq -r '.subject.arch' "$VERDICT_FILE")
            ATT=$(jq -r '.checks.attestation_signatures.result' "$VERDICT_FILE")
            EVD=$(jq -r '.checks.evidence_blob_signatures.result' "$VERDICT_FILE")
            UPS=$(jq -r '.checks.upstream_digest_match.result' "$VERDICT_FILE")
            CVE=$(jq -r '.checks.cve_policy.result' "$VERDICT_FILE")
            VRD=$(jq -r '.verdict' "$VERDICT_FILE")

            icon() { if [[ "$1" == "PASS" ]]; then echo "pass"; else echo "FAIL"; fi; }

            echo "| ${VARIANT} | ${ARCH} | $(icon $ATT) | $(icon $EVD) | $(icon $UPS) | $(icon $CVE) | **$(icon $VRD)** |" >> /tmp/pr-comment.md

            if [[ "$VRD" != "PASS" ]]; then
              OVERALL_VERDICT="FAIL"
            fi
          done

          echo "" >> /tmp/pr-comment.md

          # CVE details table
          echo "<details>" >> /tmp/pr-comment.md
          echo "<summary>CVE Details</summary>" >> /tmp/pr-comment.md
          echo "" >> /tmp/pr-comment.md
          echo "| Image | Arch | Critical | High | Fixable (C/H) | Medium | Low |" >> /tmp/pr-comment.md
          echo "|-------|------|:--------:|:----:|:-------------:|:------:|:---:|" >> /tmp/pr-comment.md

          for dir in verdicts/review-*/; do
            [ -f "${dir}review-verdict.json" ] || continue
            VERDICT_FILE="${dir}review-verdict.json"

            VARIANT=$(jq -r '.subject.version + "-" + .subject.variant' "$VERDICT_FILE")
            ARCH=$(jq -r '.subject.arch' "$VERDICT_FILE")
            CRIT=$(jq -r '.checks.cve_policy.summary.critical' "$VERDICT_FILE")
            HIGH=$(jq -r '.checks.cve_policy.summary.high' "$VERDICT_FILE")
            MED=$(jq -r '.checks.cve_policy.summary.medium' "$VERDICT_FILE")
            LOW=$(jq -r '.checks.cve_policy.summary.low' "$VERDICT_FILE")
            FIX_CRIT=$(jq -r '.checks.cve_policy.summary.fixable_critical // 0' "$VERDICT_FILE")
            FIX_HIGH=$(jq -r '.checks.cve_policy.summary.fixable_high // 0' "$VERDICT_FILE")

            echo "| ${VARIANT} | ${ARCH} | ${CRIT} | ${HIGH} | ${FIX_CRIT}/${FIX_HIGH} | ${MED} | ${LOW} |" >> /tmp/pr-comment.md
          done

          echo "" >> /tmp/pr-comment.md
          echo "</details>" >> /tmp/pr-comment.md
          echo "" >> /tmp/pr-comment.md

          if [[ "$OVERALL_VERDICT" == "PASS" ]]; then
            echo "**Overall Verdict: PASS** — All images passed review." >> /tmp/pr-comment.md
          else
            echo "**Overall Verdict: FAIL** — One or more images failed review." >> /tmp/pr-comment.md
          fi

          echo "verdict=$OVERALL_VERDICT" >> $GITHUB_OUTPUT

          cat /tmp/pr-comment.md

      - name: Post PR Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.gate-check.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/pr-comment.md

      # The review runs on workflow_run, so its result never attaches to the PR
      # as a check and cannot be required by a ruleset. Post it back onto the PR
      # head as a commit status so the gate can actually block a merge instead of
      # only advising via a comment. Context matches the value seeded by
      # pr-gate.yml so the two resolve to one status, not two.
      - name: Publish CVE gate commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.gate-check.outputs.head_sha }}
          VERDICT: ${{ steps.summary.outputs.verdict }}
          REVIEW_RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$VERDICT" == "PASS" ]]; then
            STATE=success
            DESC="All images passed attestation, evidence, upstream and CVE policy checks"
          elif [[ "$VERDICT" == "FAIL" ]]; then
            STATE=failure
            DESC="One or more images failed review - see the summary comment"
          else
            # The summary step did not complete, so no verdict was produced.
            STATE=error
            DESC="Review did not produce a verdict"
          fi

          gh api -X POST "/repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context="review/cve-policy" \
            -f description="$DESC" \
            -f target_url="https://github.com/${REPO}/actions/runs/${REVIEW_RUN_ID}" \
            > /dev/null

          echo "Posted commit status review/cve-policy=$STATE on ${HEAD_SHA:0:7}"
