# Pinned tool versions for the CI pipeline.
#
# Nothing here may be installed from a mutable ref. Before this file existed,
# build.yml installed syft and grype by piping
# raw.githubusercontent.com/anchore/{syft,grype}/main/install.sh into sh -- from
# `main`, not a tag -- in the same job that holds the cosign signing key and
# `packages: write`. Anyone able to push to either default branch had code
# execution alongside the signing material.
#
# Checksums live in scripts/install-tools.sh next to the download that uses
# them, so a version bump that forgets its checksum fails loudly instead of
# silently skipping verification.
#
# cosign: v2, not v3, deliberately. cosign v3 defaults to
# --new-bundle-format=true and writes attestations as OCI referrers; v2 writes
# the legacy sha256-<digest>.att layout, which is what this repo's release.yml
# and review.yml read back. The cosign-installer steps in this repo carried no
# `cosign-release:` pin at all, so they installed whatever was latest -- which is
# now v3. Migrate the org together, never one repo at a time.

COSIGN_VERSION=v2.6.1
SYFT_VERSION=v1.51.0
GRYPE_VERSION=v0.117.0
OPA_VERSION=v1.19.1
GITLEAKS_VERSION=v8.30.1
