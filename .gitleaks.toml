# Secret-scanning configuration.
#
# THIS FILE WAS 0 BYTES until this commit, committed empty in "Initial Commit"
# and never filled in. gitleaks treats an empty config as "zero rules": it scans
# successfully, matches nothing, and exits 0 -- indistinguishable from a clean
# scan. Nothing in this repository ran gitleaks at all, so the empty file was
# never even reached; it simply sat here looking like a control.
#
# That combination is what `scripts/bot-propose-approval.sh` wrote
# "gitleaks_passed": true into, as a hardcoded literal. The sibling repos cite
# this repository by name in their own policy comments because of it.
#
# Three independent guards now prevent a repeat:
#   1. [extend] useDefault below.
#   2. scripts/repo-gate.sh measures this file's real byte count and feeds it to
#      the policy, rather than asserting anything about it.
#   3. GITLEAKS_CONFIG_EMPTY / GITLEAKS_DEFAULTS_DISABLED in policies.rego deny
#      on a config under 64 bytes or one that does not extend the defaults.

title = "trusted-base-images"

[extend]
useDefault = true

# --- Repository-specific rules ---------------------------------------------
# This repo builds and signs base images, so the signing material and the
# registry credentials are the exposure that matters.

[[rules]]
id          = "cosign-sigstore-private-key"
description = "Cosign / Sigstore private key block"
regex       = '''-----BEGIN (ENCRYPTED )?SIGSTORE PRIVATE KEY-----'''
keywords    = ["SIGSTORE PRIVATE KEY"]
tags        = ["key", "cosign", "critical"]

[[rules]]
id          = "pem-private-key-block"
description = "Any PEM-encoded private key block"
regex       = '''-----BEGIN (RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY( BLOCK)?-----'''
keywords    = ["PRIVATE KEY"]
tags        = ["key", "critical"]

[[rules]]
id          = "jwt-token"
description = "JWT (e.g. a sigstore-audience OIDC token pasted into a predicate)"
regex       = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'''
keywords    = ["eyJ"]
tags        = ["token", "jwt"]

[[rules]]
id          = "github-pat"
description = "GitHub personal access token"
regex       = '''\b(ghp|gho|ghu|ghs|ghr|github_pat)_[A-Za-z0-9_]{22,}\b'''
keywords    = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_"]
tags        = ["token", "github"]

# --- Allowlist -------------------------------------------------------------
# Narrow and justified. Each entry is somewhere a scanner would otherwise be
# right to complain.

[allowlist]
description = "Public keys, generated output, and policy test fixtures"
paths = [
  # Public halves of signing keypairs. Not secrets -- downstream consumers need
  # them to verify, and they say PUBLIC KEY, not PRIVATE KEY.
  '''\.github/pdp/public-keys/.*\.pub$''',
  '''^docs/(dist|node_modules|\.astro)/''',
  '''^\.github/pdp/policies_test\.rego$''',
]
regexes = [
  # Placeholder digests in docs and fixtures.
  '''sha256:0{64}''',
  '''sha256:<fill>''',
]
